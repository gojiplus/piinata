url: https://gojiplus.github.io/piinata/
template:
  bootstrap: 5

reference:
  - title: Scan
    desc: Find likely personal data and act on what was found.
    contents:
      - pii_scan
      - pii_summary
      - pii_check
  - title: Decide
    desc: Review what was found and record the decisions with the project.
    contents:
      - pii_review
      - pii_config
  - title: Redact
    desc: Remove or replace what was flagged.
    contents:
      - pii_redact
      - pii_redact_files
  - title: Read
    desc: Turn files and objects into fields, and account for every file.
    contents:
      - pii_read
      - pii_read_report
      - as_pii_fields

articles:
  - title: Design
    navbar: Design
    contents:
      - articles/design
      - articles/roadmap
